# schema.yaml
on_screen_count: map(list(include('screen_config')), key=int())
global_failback: map(include('device'), key=str())
interactive: include('interactive_opts', required=False)

---

screen_config:
  map(any(include('device'), include('hooks'), str()), key=str(), required=False)

device:
  resolution: str(required=False)
  frequency: num(required=False)
  primary: bool(required=False)
  left-of: str(required=False)
  right-of: str(required=False)
  above: str(required=False)
  below: str(required=False)
  rotate: str(required=False)
  disabled: bool(required=False)

hooks:
  post: list(str(), required=False)
  pre: list(str(), required=False)

interactive_opts:
  sleep_sec: num(required=False)
  command: str(required=False)

