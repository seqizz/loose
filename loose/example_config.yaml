# This is an auto-generated example configuration for loose 🫠

# Here we define what happens when we have X amount of screens connected
on_screen_count:
  # If we have 1 screen connected, we will use this section
  1:
    # This is an ordered list of "preferences", so we will first try this configuration
    # It says that we want to use the screen named eDP-1
    - eDP-1:
        # We want to set its resolution to 1920x1080
        resolution: 1920x1080
        # and its refresh rate to 60Hz
        frequency: 60

    # As you can see, we can have multiple configurations for the same screen.
    # If we want to "rotate" (or previous preference is unapplicable
    # due to declared screen's capabilities), we will try the next one.

    # For the next preference we don't give any configuration options.
    # 💡This means all options you saw were optional. If you don't specify them, they will
    # be set to the "preferred" settings from xrandr. You can check the preferred
    # settings of your devices by running `xrandr` and looking for `+` in the output.
    - eDP-1:

    # 💡The screen name starts with an underscore on this one. This means
    # this is an "alias". When loose starts, it will try to find suitable screens
    # for all aliases (and it will try to be consistent between starts).
    # By this way we can define (purposefully) vague preferences,
    # and loose will try to find the best match for it on screens which
    # will have different names/capabilities.
    - _1:
        resolution: 1920x1200
        frequency: 60

  # Now let's say we have 2 screens connected
  2:
    # First one is simple, we want to use single screen if
    # any of the screens connected can supply the resolution / refresh rate we want.
    # 💡 If we find one, the other monitor will be disabled for this preference.
    - _1:
        resolution: 3440x1440
        frequency: 100

    # If we can't find one which can meet above requirements, we will try to utilize
    # both screens below. One of them will be the primary screen,
    # and the other one will be placed to the right of it.
    # Valid options for placement are: left-of, right-of, above and below
    #
    # Rotation is also supported.
    # Valid values are: normal (default), left, right and inverted.
    #
    # 💡If any of the screens can't supply the resolutions we want,
    # this section will be skipped. All declared preferences are hard requirements.
    - _2:
        resolution: 1920x1200
        primary: true
      _1:
        resolution: 1920x1200
        right-of: _2
        rotate: left
      hooks:
        pre:
          - example command stop
        post:
          - 'echo "Xft.dpi: 118" | xrdb -merge'
          - example command start

    # Yep, we also support hooks which will run before/after applying the config.
    # They should be defined in the same level with monitor/alias names.
    # 💡A failing hook will not stop the operation, it will be only logged.

  3:
    - _1:
        primary: true
      _2:
        right-of: _1
      eDP-1:
        disabled: true
    - _1:
        right-of: _2
      _2:
        primary: true
      eDP-1:
        disabled: true


    # You can guess what we're trying to do above: Explicitly disabling the laptop's monitor
    # (eDP-1) and putting 2 extra screens next to each other. We prefer the one on the left
    # to be the primary.
    # Since we did not give much requirements here, attached monitors will met the conditions,
    # but we are doing a small hack here: If we don't like the final placement
    # we can swap them. (E.g. if loose assigned _1 alias to the "wrong" monitor).
    # With these declarations, we can simply rotate to the next one and keep the primary on the left.

# This is the failback configuration. If we can't find any suitable configuration
# or something goes wrong, we will rely on this one. So it's a good idea to keep
# this one as simple as possible. If you're a laptop user, you can use this
# hardcode your laptop's screen name here.
# 💡 global_failback only supports single device configuration, not a list!
global_failback:
  _1:
