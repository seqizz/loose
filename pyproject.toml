[project]
name = "loose"
version = "0.6.0"
description = "A simple tool to apply XrandR configurations"
authors = [
    { name = "Gürkan", email = "gitoperations@gurkan.in" },
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.4.0",
    "jc>=1.25.0",
    "pyyaml>=6.0.1",
    "xdg-base-dirs>=6.0.1",
    "pyedid>=1.0.3",
    "yamale>=4.0.4",
    "filelock>=3.16.1",
]

[project.scripts]
loose = "loose.loose:main_wrapper"

[dependency-groups]
dev = [
    "shtab>=1.6.5",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/showtest.py"
